# AUTH_MODE=none: local use only. No client token; nginx adds the server token.
# start.sh refuses this mode unless BIND_IP is a loopback address.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    access_log /dev/stdout;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        location = /healthz {
            proxy_set_header Authorization "";
            set $upstream_mcp "mcp-grafana:8000";
            proxy_pass http://$upstream_mcp/healthz;
        }

        location /mcp {
            set $mcp_user "local";
            include /etc/nginx/proxy-mcp.conf;
        }

        location / {
            return 404;
        }
    }
}
