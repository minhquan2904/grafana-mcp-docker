# Shared by both auth modes: forward an already-authorized request to mcp-grafana.

# Swap the client's token for the server token mcp-grafana expects.
include /etc/nginx/secrets/upstream-auth.conf;
proxy_set_header Host mcp-grafana:8000;
proxy_set_header X-MCP-User $mcp_user;
set $upstream_mcp "mcp-grafana:8000";
proxy_pass http://$upstream_mcp;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_buffering off;
proxy_cache off;
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
