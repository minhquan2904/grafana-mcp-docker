# AUTH_MODE=static: each client has its own token, managed with
# ./start.sh add-client / remove-client. No external service involved.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    # Rendered by start.sh: "Bearer <token>" -> client name. Keys are 71 chars,
    # over the default bucket size of 64.
    map_hash_bucket_size 128;
    include /etc/nginx/secrets/clients.map;

    log_format mcp '$remote_addr user=$mcp_user "$request" $status $body_bytes_sent '
                   'rt=$request_time';
    access_log /dev/stdout mcp;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    server_tokens off;

    # Docker DNS; variables in proxy_pass make nginx re-resolve when containers restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        # No auth on healthz, so drop whatever the caller sent.
        location = /healthz {
            proxy_set_header Authorization "";
            set $upstream_mcp "mcp-grafana:8000";
            proxy_pass http://$upstream_mcp/healthz;
        }

        location @unauthorized {
            add_header WWW-Authenticate 'Bearer' always;
            default_type application/json;
            return 401 '{"error":"unauthorized","how_to_fix":"Send Authorization: Bearer <token>. Ask the server owner for a token."}';
        }

        location /mcp {
            # Only `return` inside `if`; the JSON body comes from @unauthorized.
            error_page 401 = @unauthorized;
            if ($mcp_user = "") {
                return 401;
            }
            include /etc/nginx/proxy-mcp.conf;
        }

        location / {
            return 404;
        }
    }
}
