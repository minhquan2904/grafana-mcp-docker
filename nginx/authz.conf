# AUTH_MODE=authz: every /mcp request is checked by an external service
# (AUTHZ_URL) through auth_request. That service answers 2xx (allow), 401 or 403,
# and may name the caller in an X-MCP-Gateway-User response header.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    log_format mcp '$remote_addr user=$mcp_user "$request" $status $body_bytes_sent '
                   'auth=$upstream_status rt=$request_time';
    access_log /dev/stdout mcp;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    server_tokens off;

    # Docker DNS forwards to the host resolver, so AUTHZ_URL may be any reachable name.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        location = /healthz {
            proxy_set_header Authorization "";
            set $upstream_mcp "mcp-grafana:8000";
            proxy_pass http://$upstream_mcp/healthz;
        }

        location = /_authz {
            internal;
            # Rendered by start.sh from AUTHZ_URL: set $authz_url, Host header.
            include /etc/nginx/secrets/authz.conf;
            proxy_pass $authz_url;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            # auth_request sends no body; the client's Authorization goes through as is.
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location @unauthorized {
            default_type application/json;
            return 401 '{"error":"unauthorized","how_to_fix":"Token is wrong, expired or revoked. Get a new one from your SSO gateway."}';
        }

        location @forbidden {
            default_type application/json;
            return 403 '{"error":"forbidden","how_to_fix":"Your account is not allowed to use this MCP server. Ask the gateway admin."}';
        }

        location /mcp {
            auth_request /_authz;
            error_page 401 = @unauthorized;
            error_page 403 = @forbidden;
            auth_request_set $mcp_user $upstream_http_x_mcp_gateway_user;
            include /etc/nginx/proxy-mcp.conf;
        }

        location / {
            return 404;
        }
    }
}
